# Processing settings shared by runs. Paths are relative to this file or absolute.
tools:
  catgt_location: ../CatGT-win
  catgt_batch_file: runit.bat
  overstrike_location: ../OverStrike-win

sampling:
  np_fs: 30000
  behavior_fs: 24414.0625

catgt:
  save_stream_type: 2
  n_channels_total: 385
  time_range: 0
  probe_folder_flag: -prb_fld
  ap_flag: -ap
  lf_flag: -lf
  common_reference: -gblcar
  # CatGT expects high-pass cutoff then low-pass cutoff.
  ap_filter: butter,12,300,6000
  lf_filter: butter,12,0,400
  lf_downsample_factor: 30
  overstrike_linefill: true
  overstrike_executable: OverStrike
  compressor_executable: mtscomp
  compression_dtype: int16

saturation:
  begin_end_cutoff_s: [1, 1]
  load_from_file: true
  replace: true
  mode: zeros
  surrounding_ms: 2
  abs_min: -1900
  abs_max: 1900
  fraction_channels: 0.1
  chunk_size: 30000
  n_jobs: 1
  progress_bar: true

sorting:
  do_spike_sorting: true
  overwrite_spikesorting: false
  overwrite_raw: false
  overwrite_lfp: true
  overwrite_chan_map: true
  create_compressed: false
  save_lfp: false
  copy_aux_data: false
  overwrite_aux_data: false
  save_multirecording_info: true
  sorter: kilosort4
  n_chan_bin_extra: 1
  kilosort_settings: {}
  kilosort_kwargs:
    probe: null
    filename: null
    file_object: null
    data_dtype: null
    do_CAR: true
    invert_sign: false
    device: null
    progress_bar: null
    save_extra_vars: true
    clear_cache: false
    save_preprocessed_copy: false
    bad_channels: null
    shank_idx: null
    verbose_console: true
    verbose_log: true
    torch_thread_lim: null

drift_correction:
  run: true
  use_local_data: false
  chunk_duration: 1s
  progress_bar: true
  float_dtype: true
  peak_detection_method: locally_exclusive
  peak_sign: neg
  n_jobs: 1
  bin_s: 6.0
  detect_threshold: 5.0
  exclude_sweep_ms: 0.1
  radius_um: 50
  localization_method: grid_convolution
  localization_mode: gaussian_2d
  localization_sigma_um: [5, 10, 15, 20, 25]
  motion_method: iterative_template
  rigid: false
  win_step_um: 50.0
  win_scale_um: 100.0
  hist_margin_um: 0
  win_shape: gaussian
  num_amp_bins: 5
  border_mode: force_extrapolate
  spatial_interpolation_method: kriging
  sigma_um: 20.0
  p: 2
  save_preprocessing: true
  overwrite_preprocessing: true
  resave_motion_if_loading: false
  calculate_session_displacement: true
  plot_online: false
  saturation_mode: zeros
  remove_bad_channels: true

workflow:
  frequency_of_concatenation: do_everything
  skip_kilosort_preprocessing: false
  legacy_session_set_mode: false
  do_preprocessing: false
  testing: false

legacy_spikeinterface:
  sorter: kilosort4
  n_jobs: 15
  bad_channels: []
  bin_s: 6.0
  silence_mode: zeros
  censored_period_ms: 0.3
  max_spikes_per_unit: 300
  waveforms_ms_before: 2
  waveforms_ms_after: 3.0
  saturation_view_s: [191, 192]
  spike_view_s: [317.14, 317.15]
  trace_color_limits: [-2000, 2000]
  filtered_color_limits: [-20, 20]
  filter_min_hz: 300
  filter_max_hz: 6000
  sorter_run_kwargs:
    verbose: true
    do_CAR: true
    skip_kilosort_preprocessing: false
    do_correction: true
    save_extra_vars: true
    save_preprocessed_copy: false
    delete_recording_dat: true
  chunk_duration: 1s
  create_sparse_analyzer: true
  compute_pc_features: false
